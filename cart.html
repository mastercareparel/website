<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Your Cart</title>
<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    margin-bottom:30px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.cart-left{
    display:flex;
    align-items:center;
}

.cart-item img{
    width:80px;
    height:80px;
    object-fit:contain;
}

.item-info{
    margin-left:20px;
}

.item-name{
    font-weight:600;
}

.price{
    color:#555;
    margin-top:5px;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.qty-box button{
    width:30px;
    height:30px;
    cursor:pointer;
}

.remove-btn{
    margin-left:15px;
    border:none;
    background:none;
    color:red;
    cursor:pointer;
    font-size:14px;
}

.total-box{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
}

.checkout-btn{
    margin-top:20px;
    width:100%;
    padding:15px;
    background:black;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}


</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PPWDCWKL"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="container">

<h1>Your Cart</h1>

<div id="cart-items"></div>

<div class="total-box">
<span>Total</span>
<span id="cart-total">₹0</span>
</div>

<button class="checkout-btn" onclick="goCheckout()">
Proceed to Checkout
</button>
</div>



<script>

let cartContainer =
document.getElementById("cart-items");

const email =
localStorage.getItem("userEmail");

function goCheckout(){

let logged =
localStorage.getItem("userLogged");

if(!logged){
window.location.href = "login.html";
}else{
window.location.href = "checkout.html";
}

}

function loadCart(){

fetch("/api/cart/" + email)

.then(res=>res.json())

.then(data=>{

cartContainer.innerHTML = "";

if(!data.cart || data.cart.length === 0){

cartContainer.innerHTML =
"<p>Your cart is empty</p>";

document.getElementById("cart-total")
.innerText = "₹0";

return;
}

data.cart.forEach(item=>{

let itemTotal =
item.price * item.quantity;

let div =
document.createElement("div");

div.className = "cart-item";

div.innerHTML = `

<div class="cart-left">

<img src="${item.cover_image}">

<div class="item-info">

<div class="item-name">
${item.name}
</div>

<div class="price">
₹${item.price}
</div>

<div class="qty-box">

<span>
Qty: ${item.quantity}
</span>

</div>

</div>

</div>

<div>
₹${itemTotal}
</div>
`;

cartContainer.appendChild(div);

});

document.getElementById("cart-total")
.innerText =
"₹" + data.total;

});

}

loadCart();

</script>

</body>
</html>
